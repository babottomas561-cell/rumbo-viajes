name: Actualizar precios de vuelos

on:
  schedule:
    - cron: "17 */4 * * *" # cada 4 horas
  workflow_dispatch:
    inputs:
      meses:
        description: "Meses a renovar (ej. 1,2). Vacío = rotación automática"
        required: false
      dias:
        description: "Días de salida (ej. 3,10,17,24). Vacío = 10"
        required: false
      modo:
        description: "iv (ida y vuelta) · ida · vuelta (solo ida)"
        required: false
      origenes:
        description: "Orígenes (ej. TUC,BUE). Vacío = TUC,SLA,BUE"
        required: false

concurrency:
  group: precios-${{ inputs.modo || 'iv' }}-${{ inputs.meses || 'auto' }}-${{ inputs.origenes || 'def' }}-${{ inputs.dias || '10' }}
  cancel-in-progress: false

jobs:
  vuelos:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/flights-worker.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MESES: ${{ inputs.meses }}
          DIAS: ${{ inputs.dias }}
          MODO: ${{ inputs.modo }}
          ORIGENES: ${{ inputs.origenes }}
          TABS: 3
